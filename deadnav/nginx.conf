# Nginx reverse proxy configuration for Deadnav
# Place this file at: /etc/nginx/sites-available/deadnav

upstream deadnav_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;  # CHANGE THIS

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # CHANGE THIS

    # SSL certificates (use Let's Encrypt)
    ssl_certificate     /etc/ssl/certs/deadnav.crt;
    ssl_certificate_key /etc/ssl/private/deadnav.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Gzip compression
    gzip on;
    gzip_types application/json;
    gzip_min_length 1000;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://deadnav_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://deadnav_backend;
        access_log off;
    }

    # Logging
    access_log /var/log/nginx/deadnav_access.log;
    error_log /var/log/nginx/deadnav_error.log;
}
