<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadnav API Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            opacity: 0.8;
        }

        .response {
            margin-top: 15px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .response.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .response.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .token-display {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .token-display h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .token-display code {
            word-break: break-all;
            color: #856404;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .status-badge.authenticated {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.not-authenticated {
            background: #f8d7da;
            color: #721c24;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .api-url-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-url-group input {
            flex: 1;
        }

        .api-url-group button {
            width: auto;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Deadnav API Test Page</h1>

        <div class="grid">
            <!-- API Configuration -->
            <div class="card full-width">
                <h2>⚙️ API Configuration</h2>
                <div class="form-group">
                    <label for="apiUrl">API Base URL</label>
                    <div class="api-url-group">
                        <input type="text" id="apiUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
                        <button onclick="testHealth()">Test Connection</button>
                    </div>
                </div>
                <div id="healthResponse" class="response" style="display: none;"></div>
            </div>

            <!-- Token Status -->
            <div class="card full-width">
                <h2>🔑 Authentication Status</h2>
                <div id="authStatus">
                    <span class="status-badge not-authenticated">Not Authenticated</span>
                </div>
                <div id="tokenDisplay" class="token-display" style="display: none;">
                    <h3>JWT Token:</h3>
                    <code id="tokenValue"></code>
                </div>
            </div>

            <!-- Register -->
            <div class="card">
                <h2>📝 Register</h2>
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regUsername">Username *</label>
                        <input type="text" id="regUsername" required placeholder="john_doe">
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email *</label>
                        <input type="email" id="regEmail" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Password * (min 6 chars)</label>
                        <input type="password" id="regPassword" required minlength="6" placeholder="securepassword123">
                    </div>
                    <button type="submit">Register</button>
                </form>
                <div id="registerResponse" class="response" style="display: none;"></div>
            </div>

            <!-- Login -->
            <div class="card">
                <h2>🔐 Login (Password)</h2>
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginUsername">Username or Email *</label>
                        <input type="text" id="loginUsername" required placeholder="john_doe or john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password *</label>
                        <input type="password" id="loginPassword" required placeholder="securepassword123">
                    </div>
                    <button type="submit">Login</button>
                </form>
                <div id="loginResponse" class="response" style="display: none;"></div>
            </div>

            <!-- Telegram Login -->
            <div class="card">
                <h2>📱 Login via Telegram</h2>
                <form id="telegramForm" onsubmit="handleTelegramLogin(event)">
                    <div class="form-group">
                        <label for="tgId">Telegram ID *</label>
                        <input type="number" id="tgId" required placeholder="123456789">
                    </div>
                    <div class="form-group">
                        <label for="tgUsername">Telegram Username *</label>
                        <input type="text" id="tgUsername" required placeholder="john_doe">
                    </div>
                    <div class="form-group">
                        <label for="tgFirstName">First Name</label>
                        <input type="text" id="tgFirstName" placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="tgLastName">Last Name</label>
                        <input type="text" id="tgLastName" placeholder="Doe">
                    </div>
                    <button type="submit">Login with Telegram</button>
                </form>
                <div id="telegramResponse" class="response" style="display: none;"></div>
            </div>

            <!-- Get Me -->
            <div class="card">
                <h2>👤 Get Current User</h2>
                <button onclick="handleGetMe()" id="getMeBtn" disabled>Get My Info</button>
                <div id="getMeResponse" class="response" style="display: none;"></div>
            </div>

            <!-- Create Task -->
            <div class="card">
                <h2>✅ Create Task</h2>
                <form id="taskForm" onsubmit="handleCreateTask(event)">
                    <div class="form-group">
                        <label for="taskTitle">Title *</label>
                        <input type="text" id="taskTitle" required placeholder="New Task">
                    </div>
                    <div class="form-group">
                        <label for="taskDesc">Description</label>
                        <input type="text" id="taskDesc" placeholder="Task description">
                    </div>
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <input type="text" id="taskStatus" value="pending" placeholder="pending">
                    </div>
                    <div class="form-group">
                        <label for="taskPriority">Priority (1-5)</label>
                        <input type="number" id="taskPriority" value="2" min="1" max="5">
                    </div>
                    <div class="form-group">
                        <label for="taskStart">Start Date *</label>
                        <input type="datetime-local" id="taskStart" required>
                    </div>
                    <div class="form-group">
                        <label for="taskEnd">End Date *</label>
                        <input type="datetime-local" id="taskEnd" required>
                    </div>
                    <button type="submit" id="createTaskBtn" disabled>Create Task</button>
                </form>
                <div id="taskResponse" class="response" style="display: none;"></div>
            </div>

            <!-- Get Tasks -->
            <div class="card">
                <h2>📋 Get All Tasks</h2>
                <button onclick="handleGetTasks()" id="getTasksBtn" disabled>Get Tasks</button>
                <div id="tasksResponse" class="response" style="display: none;"></div>
            </div>

            <!-- Get Statistics -->
            <div class="card">
                <h2>📊 Get Statistics</h2>
                <button onclick="handleGetStatistics()" id="getStatsBtn" disabled>Get Statistics</button>
                <div id="statsResponse" class="response" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        let currentToken = localStorage.getItem('jwt_token');

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            updateAuthStatus();
            setDefaultDates();
        });

        function setDefaultDates() {
            const now = new Date();
            const later = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
            
            document.getElementById('taskStart').value = now.toISOString().slice(0, 16);
            document.getElementById('taskEnd').value = later.toISOString().slice(0, 16);
        }

        function getApiUrl() {
            return document.getElementById('apiUrl').value.trim();
        }

        function updateAuthStatus() {
            const authStatus = document.getElementById('authStatus');
            const tokenDisplay = document.getElementById('tokenDisplay');
            const tokenValue = document.getElementById('tokenValue');
            const getMeBtn = document.getElementById('getMeBtn');
            const createTaskBtn = document.getElementById('createTaskBtn');
            const getTasksBtn = document.getElementById('getTasksBtn');
            const getStatsBtn = document.getElementById('getStatsBtn');

            if (currentToken) {
                authStatus.innerHTML = '<span class="status-badge authenticated">✓ Authenticated</span>';
                tokenDisplay.style.display = 'block';
                tokenValue.textContent = currentToken;
                getMeBtn.disabled = false;
                createTaskBtn.disabled = false;
                getTasksBtn.disabled = false;
                getStatsBtn.disabled = false;
            } else {
                authStatus.innerHTML = '<span class="status-badge not-authenticated">✗ Not Authenticated</span>';
                tokenDisplay.style.display = 'none';
                tokenValue.textContent = '';
                getMeBtn.disabled = true;
                createTaskBtn.disabled = true;
                getTasksBtn.disabled = true;
                getStatsBtn.disabled = true;
            }
        }

        function showResponse(elementId, data, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'response ' + (isSuccess ? 'success' : 'error');
            element.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        async function testHealth() {
            const apiUrl = getApiUrl();
            const responseDiv = document.getElementById('healthResponse');
            
            try {
                const response = await fetch(`${apiUrl}/health`);
                const data = await response.json();
                responseDiv.style.display = 'block';
                responseDiv.className = 'response success';
                responseDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                responseDiv.style.display = 'block';
                responseDiv.className = 'response error';
                responseDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const apiUrl = getApiUrl();
            
            const data = {
                username: document.getElementById('regUsername').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPassword').value
            };

            try {
                const response = await fetch(`${apiUrl}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showResponse('registerResponse', result, true);
                    currentToken = result.token;
                    localStorage.setItem('jwt_token', result.token);
                    updateAuthStatus();
                } else {
                    showResponse('registerResponse', result, false);
                }
            } catch (error) {
                showResponse('registerResponse', { error: error.message }, false);
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const apiUrl = getApiUrl();
            
            const data = {
                username_or_email: document.getElementById('loginUsername').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const response = await fetch(`${apiUrl}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showResponse('loginResponse', result, true);
                    currentToken = result.token;
                    localStorage.setItem('jwt_token', result.token);
                    updateAuthStatus();
                } else {
                    showResponse('loginResponse', result, false);
                }
            } catch (error) {
                showResponse('loginResponse', { error: error.message }, false);
            }
        }

        async function handleTelegramLogin(event) {
            event.preventDefault();
            const apiUrl = getApiUrl();
            
            const data = {
                telegram_id: parseInt(document.getElementById('tgId').value),
                username: document.getElementById('tgUsername').value,
                first_name: document.getElementById('tgFirstName').value,
                last_name: document.getElementById('tgLastName').value,
                auth_date: Math.floor(Date.now() / 1000),
                hash: 'test_hash'
            };

            try {
                const response = await fetch(`${apiUrl}/api/v1/auth/telegram`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showResponse('telegramResponse', result, true);
                    currentToken = result.token;
                    localStorage.setItem('jwt_token', result.token);
                    updateAuthStatus();
                } else {
                    showResponse('telegramResponse', result, false);
                }
            } catch (error) {
                showResponse('telegramResponse', { error: error.message }, false);
            }
        }

        async function handleGetMe() {
            const apiUrl = getApiUrl();
            
            try {
                const response = await fetch(`${apiUrl}/api/v1/auth/me`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                const result = await response.json();
                
                if (response.ok) {
                    showResponse('getMeResponse', result, true);
                } else {
                    showResponse('getMeResponse', result, false);
                }
            } catch (error) {
                showResponse('getMeResponse', { error: error.message }, false);
            }
        }

        async function handleCreateTask(event) {
            event.preventDefault();
            const apiUrl = getApiUrl();
            
            const data = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                status: document.getElementById('taskStatus').value,
                priority: parseInt(document.getElementById('taskPriority').value),
                start_date: new Date(document.getElementById('taskStart').value).toISOString(),
                end_date: new Date(document.getElementById('taskEnd').value).toISOString()
            };

            try {
                const response = await fetch(`${apiUrl}/api/v1/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showResponse('taskResponse', result, true);
                } else {
                    showResponse('taskResponse', result, false);
                }
            } catch (error) {
                showResponse('taskResponse', { error: error.message }, false);
            }
        }

        async function handleGetTasks() {
            const apiUrl = getApiUrl();
            
            try {
                const response = await fetch(`${apiUrl}/api/v1/tasks`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                const result = await response.json();
                
                if (response.ok) {
                    showResponse('tasksResponse', result, true);
                } else {
                    showResponse('tasksResponse', result, false);
                }
            } catch (error) {
                showResponse('tasksResponse', { error: error.message }, false);
            }
        }

        async function handleGetStatistics() {
            const apiUrl = getApiUrl();
            
            try {
                const response = await fetch(`${apiUrl}/api/v1/statistics`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                const result = await response.json();
                
                if (response.ok) {
                    showResponse('statsResponse', result, true);
                } else {
                    showResponse('statsResponse', result, false);
                }
            } catch (error) {
                showResponse('statsResponse', { error: error.message }, false);
            }
        }
    </script>
</body>
</html>
