version: "3.8"

# Production Docker Compose for Deadnav
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f

services:
  mysql:
    image: mysql:8.0
    container_name: deadnav_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-deadnav}
      MYSQL_USER: ${DB_USER:-deadnav_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_EXPOSE_PORT:-127.0.0.1:3306}:3306" # bound to localhost only
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deadnav_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPU_LIMIT:-2.0}"
          memory: "${MYSQL_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "0.5"
          memory: "256M"
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=50
      --innodb-buffer-pool-size=256M
      --slow-query-log=1
      --long-query-time=2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.26"
    container_name: deadnav_api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-deadnav_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-deadnav}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - deadnav_internal
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.0}"
          memory: "${API_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "0.25"
          memory: "64M"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  deadnav_internal:
    driver: bridge
    name: deadnav_network

volumes:
  mysql_data:
    name: deadnav_mysql_data
    driver: local
