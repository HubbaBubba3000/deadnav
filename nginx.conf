events {
    worker_connections 1024;
}

http {
    upstream api {
        server app:8080;
    }
    upstream dozzle {
        server dozzle:8080; 
    }
    upstream game {
        server gamification:8083;
    }
    upstream vk_bot_backend {
        server vk_bot:8084;
    }
    # Добавляем upstream для нового сервиса
    upstream gamifications_stats_backend {
        server gamifications_in_stats:5000;
    }

    # 1. ОСНОВНОЙ ПРОЕКТ
    server {
        listen 80;
        server_name deadnav.xelox.me;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://api;
        }

        location /game/ {
            proxy_pass http://game;
        }

        location /health {
            proxy_pass http://api/health;
        }

        # Изменяем проксирование на новый созданный upstream
        location /gamifications_in_stats/ {
            proxy_pass http://gamifications_stats_backend;
        }
    }

    # 2. ВК БОТ
    server {
        listen 80;
        server_name vk_bot.xelox.me;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://vk_bot_backend;
            proxy_buffering off;
        }
    }

    # 3. DOZZLE (ЛОГИ)
    server {
        listen 80;
        server_name dozzle.xelox.me;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://dozzle;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }
    }
}
