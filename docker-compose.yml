version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deadnav}
      MYSQL_USER: ${MYSQL_USER:-deadnav_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - deadnav_internal
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80" # Оставляем, если нужен прямой доступ локально мимо HAProxy
    networks:
      - deadnav_internal

  nginx:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80" # HAProxy отправляет сюда весь трафик с Wireguard
    networks:
      - deadnav_internal
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    # Убрали ports 9999, теперь доступ строго через nginx по dozzle.xelox.me
    expose:
      - "8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
    networks:
      - deadnav_internal

  app:
    image: deadnav:latest
    build: ./deadnav
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://app:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-deadnav_user}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE:-deadnav}
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=*
    expose:
      - "8080"
    networks:
      - deadnav_internal

  gamification:
    image: gamification:latest
    build: ./gamification
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8083/game/g_health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-deadnav_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-deadnav}
      - SERVER_PORT=8083
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=*
    expose:
      - "8083"
    networks:
      - deadnav_internal

  gamifications_in_stats:
    image: gamifications_in_stats:latest
    build: ./gamifications_in_stats
    restart: always
    expose:
      - "5000"
    networks:
      - deadnav_internal

  vk_bot:
    image: vk_bot:latest
    build: ./vk_bot
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8084"
    environment:
      - SERVER_PORT=8084
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-deadnav_user}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE:-deadnav}
      - APP_API_URL=http://app:8080
      - GAMIFICATION_API_URL=http://gamification:8083
      - VK_API_TOKEN=${VK_API_TOKEN}
      - VK_BOT_TOKEN=${VK_BOT_TOKEN}
    networks:
      - deadnav_internal

networks:
  deadnav_internal:
    driver: bridge
    name: deadnav_network

volumes:
  mysql_data:
